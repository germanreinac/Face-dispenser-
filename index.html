<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--page-->
<title>Head Dispenser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<style>
/* Layout: the whole screen is one box drawn on a sketchbook page. Heads drop in and pile up; notes sit in the corners; a paper card slides up for a character. */
:root {
  --paper: #e9e3d2;
  --grid: #cfc8b4;
  --ink: #171614;
  --card: #f6f1e4;
  --tongue: #ee8f86;
  --hand: "Gochi Hand", "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--hand);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.note {
  position: fixed; margin: 0;
  text-transform: uppercase; letter-spacing: .06em; line-height: 1.05;
  pointer-events: none;
}
#title {
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  font-size: clamp(22px, 5vw, 34px); font-weight: 400;
  transform: rotate(-3deg);
}
#count {
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  right: max(16px, env(safe-area-inset-right, 0px));
  font-size: clamp(15px, 3.4vw, 20px); text-align: right;
  transform: rotate(2deg);
}
#count b { font-size: 1.9em; font-weight: 400; display: block; font-variant-numeric: tabular-nums; }
#hint {
  left: 0; right: 0; top: 34%;
  text-align: center; font-size: clamp(16px, 4vw, 22px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .6s;
}
#hint small { display: block; font-size: .72em; opacity: .7; margin-top: 4px; }
#hint.gone { opacity: 0; }
.btn {
  font: inherit; font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink); background: var(--card);
  border: 2.5px solid var(--ink); border-radius: 12px 9px 13px 8px;
  padding: 6px 11px; cursor: pointer;
}
.btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
.btn:active { transform: translateY(2px); }
#tools {
  position: fixed; display: flex; gap: 8px;
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  right: max(16px, env(safe-area-inset-right, 0px));
}
#card {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(430px, calc(100% - 32px)); box-sizing: border-box;
  transform: translateX(-50%) rotate(-1deg);
  background: var(--card); border: 3px solid var(--ink);
  border-radius: 22px 16px 24px 14px;
  box-shadow: 6px 7px 0 var(--ink);
  padding: 14px 16px 16px;
  animation: up .28s cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes up { from { transform: translate(-50%, 60%) rotate(4deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #card { animation: none; } }
#card header { display: flex; gap: 12px; align-items: center; }
#portrait { width: 104px; height: 104px; flex: none; }
#card h2 { margin: 0; font-size: 27px; font-weight: 400; line-height: 1; text-wrap: balance; }
#card .job { margin: 5px 0 0; font-size: 16px; line-height: 1.15; opacity: .8; }
#card dl { margin: 10px 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 16px; line-height: 1.2; }
#card dt { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; padding-top: 3px; opacity: .65; }
#card dd { margin: 0; min-width: 0; }
#card .row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>

<canvas id="c" aria-label="A box of blocky character heads. Tap to drop a head, drag heads around, tap a head to read about it."></canvas>
<h1 id="title" class="note">Head<br>dispenser</h1>
<p id="count" class="note"><b id="n">0</b>heads</p>
<p id="hint" class="note">Tap to drop a head<small>drag them around · tap one to meet it</small></p>
<div id="tools">
  <button id="tip" class="btn" type="button">Tip out</button>
  <button id="sound" class="btn" type="button">Sound on</button>
</div>
<section id="card" hidden aria-live="polite">
  <header>
    <canvas id="portrait" width="208" height="208"></canvas>
    <div>
      <h2 id="cname"></h2>
      <p class="job" id="cjob"></p>
    </div>
  </header>
  <dl>
    <dt>Likes</dt><dd id="clikes"></dd>
    <dt>Afraid of</dt><dd id="cfear"></dd>
    <dt>Real intentions</dt><dd id="cplan"></dd>
  </dl>
  <div class="row">
    <button id="pull" class="btn" type="button">Pull a face</button>
    <button id="toss" class="btn" type="button">Throw it</button>
    <button id="close" class="btn" type="button">Close</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite, Constraint, Query, Events } = Matter;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
const pv = document.getElementById('portrait'), pctx = pv.getContext('2d');
let ctx = mainCtx;
const css = getComputedStyle(document.documentElement);
const INK = css.getPropertyValue('--ink').trim() || '#171614';
const TONGUE = css.getPropertyValue('--tongue').trim() || '#ee8f86';
const CLAY = ['#f3b9a2', '#f5d36a', '#a3d3c2', '#aac6f1', '#f29f7d', '#cbb3ea', '#bfe093', '#f4a9c4', '#efe8d6'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1, SIDE = 80, boil = 0, t = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- hand-drawn line kit ---------- */
function rr(cx, cy, w, h, r, n = 5) {
  const hw = w / 2, hh = h / 2, pts = [];
  r = Math.min(r, hw, hh);
  const cs = [[cx + hw - r, cy - hh + r, -90], [cx + hw - r, cy + hh - r, 0], [cx - hw + r, cy + hh - r, 90], [cx - hw + r, cy - hh + r, 180]];
  for (const [x, y, a0] of cs) for (let i = 0; i <= n; i++) {
    const a = (a0 + 90 * i / n) * Math.PI / 180;
    pts.push([x + r * Math.cos(a), y + r * Math.sin(a)]);
  }
  return pts;
}
function hull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
function arc(cx, cy, rx, ry, a0, a1, n = 9) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
  return pts;
}
// Resample a path and push it around with two slow waves that change a few times a second.
function wobble(pts, closed, seed, amp) {
  const src = closed ? pts.concat([pts[0]]) : pts, out = [];
  let total = 0;
  for (let i = 0; i < src.length - 1; i++) {
    const [ax, ay] = src[i], [bx, by] = src[i + 1];
    const len = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(len / 12));
    for (let j = 0; j < n; j++) out.push([ax + (bx - ax) * j / n, ay + (by - ay) * j / n, total + len * j / n]);
    total += len;
  }
  if (!closed) out.push([src[src.length - 1][0], src[src.length - 1][1], total]);
  const k = seed * 7.3 + boil * 13.7;
  const p1 = hash(k) * 6.28, p2 = hash(k + 1) * 6.28, p3 = hash(k + 2) * 6.28, p4 = hash(k + 3) * 6.28;
  const f1 = 6.283 * Math.max(1, Math.round(total / 150)) / (total || 1);
  const f2 = 6.283 * Math.max(2, Math.round(total / 55)) / (total || 1);
  return out.map(([x, y, l]) => [
    x + amp * (Math.sin(l * f1 + p1) * 0.65 + Math.sin(l * f2 + p2) * 0.35),
    y + amp * (Math.sin(l * f1 + p3) * 0.65 + Math.sin(l * f2 + p4) * 0.35)]);
}
// MT maps a face of the head (its own flat x,y) onto the screen: [ux, uy, vx, vy, cx, cy]. Lines keep their pen width however the face is turned.
let MT = null;
function draw(pts, o = {}) {
  const closed = o.closed !== false;
  const w = wobble(pts, closed, o.seed || 1, o.amp == null ? 1.5 : o.amp);
  ctx.beginPath();
  for (let i = 0; i < w.length; i++) {
    let x = w[i][0], y = w[i][1];
    if (MT) { const X = MT[0] * x + MT[2] * y + MT[4]; y = MT[1] * x + MT[3] * y + MT[5]; x = X; }
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  if (closed) ctx.closePath();
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) { ctx.strokeStyle = o.stroke || INK; ctx.lineWidth = o.lw || 4.5; ctx.stroke(); }
}
const line = (pts, seed, lw = 4.5, amp = 1) => draw(pts, { closed: false, seed, lw, amp });
function blob(x, y, rx, ry = rx, fill = INK) {
  ctx.save();
  if (MT) ctx.transform(MT[0], MT[1], MT[2], MT[3], MT[4], MT[5]);
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.3); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
}

/* ---------- characters ---------- */
const FIRST = ['Bobo', 'Mirta', 'Tofu', 'Gus', 'Pepa', 'Nilo', 'Olga', 'Rufo', 'Chela', 'Tito', 'Lupe', 'Momo', 'Queso', 'Bruno', 'Nuria', 'Paco', 'Dot', 'Kiki', 'Otto', 'Greta', 'Lalo', 'Pipa'];
const LAST = ['Blockhead', 'McCube', 'de la Plastilina', 'Squarez', 'Cornerstone', 'Lumpkin', 'Brickowski', 'von Wobble', 'Cubillo', 'Fallini', 'Boxworth', 'Terrón'];
const JOBS = ['Professional faller', 'Part-time paperweight', 'Retired dice (never rolled a six)', 'Elevator critic', 'Chair tester, junior grade', 'Weather forecaster who only says "falling"', 'Doorstop with ambitions', 'Mayor of the bottom row', 'Freelance corner', 'Amateur bouncer (the bouncing kind)', 'Sugar cube impersonator', 'Night guard of this exact spot'];
const LIKES = ['landing on its good side', 'being picked first', 'soft floors', 'the number four', 'long naps at the bottom of the pile', 'staring contests', 'warm pockets', 'being stacked neatly', 'grid paper', 'a firm handshake it cannot give', 'toast, in theory', 'slow elevators'];
const FEARS = ['spheres', 'the edge of the screen', 'being a ball in a past life', 'tall piles', 'erasers', 'the button that says Tip out', 'round tables', 'stairs', 'someone drawing a moustache on it', 'Tuesdays', 'wet ink', 'being upside down at a party'];
const PLANS = ['to end up on top of the pile, no matter who is under it', 'to be thrown gently, just once', 'to find out what is behind the screen', 'to grow a neck', 'to roll, like the round ones do', 'to keep your finger', 'to be the last head standing', 'to start a band with the three heads next to it', 'to look casual until you leave', 'to borrow someone else\'s ears', 'to learn what a Tuesday is', 'none. Suspiciously none'];
const N_EYES = 9, N_BROWS = 5, N_NOSE = 6, N_MOUTH = 10, N_EXTRA = 6;

function rollFace(f) {
  f.eyes = Math.floor(rnd(0, N_EYES));
  f.brows = Math.random() < 0.45 ? 0 : Math.floor(rnd(1, N_BROWS));
  f.mouth = Math.floor(rnd(0, N_MOUTH));
  return f;
}
function newChar() {
  return rollFace({
    color: pick(CLAY),
    nose: Math.floor(rnd(0, N_NOSE)),
    extra: Math.random() < 0.55 ? 0 : Math.floor(rnd(1, N_EXTRA)),
    gap: rnd(22, 32), ey: rnd(-20, -8), my: rnd(30, 40), look: [rnd(-2.5, 2.5), rnd(-2, 2)],
    seed: Math.floor(rnd(1, 9999)),
    fw: rnd(140, 160), fh: rnd(134, 162), fd: rnd(104, 140), r: rnd(24, 42),
    ears: Math.random() < 0.6, hair: Math.floor(rnd(0, 4)),
    name: pick(FIRST) + ' ' + pick(LAST), job: pick(JOBS), likes: pick(LIKES), fear: pick(FEARS), plan: pick(PLANS),
  });
}

// Features for the front of a head, on a flat tile centred on 0,0 (about 150 units wide).
function drawFeatures(f, blink, mood) {
  const sd = f.seed, g = f.gap, ey = f.ey, my = f.my;
  let eyes = f.eyes, mouth = f.mouth, brows = f.brows;
  if (mood === 'ouch') { eyes = 4; mouth = 5; brows = 0; }
  if (mood === 'wow') { eyes = 5; mouth = 3; brows = 3; }
  const eye = (x, kind, i) => {
    if (blink && [0, 1, 5, 8].includes(kind)) return line([[x - 7, ey], [x + 7, ey]], sd + i);
    switch (kind) {
      case 0: blob(x, ey, 5.5); break;
      case 1: draw(arc(x, ey, 10, 10, 0, 330, 12), { fill: '#fff', seed: sd + i, lw: 4, amp: .8 }); blob(x + f.look[0], ey + f.look[1], 3.6); break;
      case 2: line(arc(x, ey + 3, 8, 8, 200, 340), sd + i); break;
      case 3: line([[x - 8, ey], [x + 8, ey]], sd + i); break;
      case 4: { const d = i ? -1 : 1; line([[x - 7 * d, ey - 7], [x + 6 * d, ey], [x - 7 * d, ey + 7]], sd + i); break; }
      case 5: { const r = i ? 7 : 12; draw(arc(x, ey, r, r, 0, 330, 12), { fill: '#fff', seed: sd + i, lw: 4, amp: .8 }); blob(x + f.look[0], ey + f.look[1], r * .36); break; }
      case 6: if (i) line(arc(x, ey + 3, 8, 8, 200, 340), sd + i); else blob(x, ey, 5.5); break;
      case 7: line([[x - 6, ey - 6], [x + 6, ey + 6]], sd + i); line([[x + 6, ey - 6], [x - 6, ey + 6]], sd + i + 9); break;
      case 8: blob(x, ey, 4.5, 9); break;
    }
  };
  eye(-g, eyes, 0); eye(g, eyes, 1);

  const by = ey - 19;
  if (brows === 1) { line([[-g - 10, by - 5], [-g + 9, by + 3]], sd + 20); line([[g + 10, by - 5], [g - 9, by + 3]], sd + 21); }
  if (brows === 2) { line([[-g - 10, by + 3], [-g + 9, by - 5]], sd + 20); line([[g + 10, by + 3], [g - 9, by - 5]], sd + 21); }
  if (brows === 3) { line([[-g - 9, by - 3], [-g + 9, by - 3]], sd + 20); line(arc(g, by - 4, 10, 7, 200, 340), sd + 21); }
  if (brows === 4) { line([[-g - 10, by], [-g + 10, by]], sd + 20, 6.5); line([[g - 10, by], [g + 10, by]], sd + 21, 6.5); }

  const ny = (ey + my) / 2;
  switch (f.nose) {
    case 1: draw([[-6, ny - 5], [8, ny - 5], [3, ny + 9]], { fill: INK, seed: sd + 30, lw: 2.5, amp: .6 }); break;
    case 2: line([[1, ny - 12], [-2, ny + 5], [7, ny + 6]], sd + 30); break;
    case 3: blob(-4, ny + 2, 2.4); blob(5, ny + 2, 2.4); break;
    case 4: line([[-3, ey - 6], [-4, ny + 6], [5, ny + 8]], sd + 30); break;
    case 5: draw(arc(1, ny + 1, 6.5, 6.5, 0, 330, 10), { seed: sd + 30, lw: 4, amp: .6 }); break;
  }

  switch (mouth) {
    case 0: line(arc(0, my - 8, 20, 13, 25, 155), sd + 40); break;
    case 1: line([[-15, my], [15, my]], sd + 40); break;
    case 2:
      draw([[-3, my], [-3, my + 9], [0, my + 14], [6, my + 15], [11, my + 10], [11, my]], { fill: TONGUE, seed: sd + 41, lw: 3.5, amp: .6 });
      line([[-15, my], [17, my]], sd + 40); break;
    case 3: blob(0, my + 2, 8, 10); break;
    case 4: line(arc(0, my + 12, 18, 11, 205, 335), sd + 40); break;
    case 5: line([[-18, my + 2], [-11, my - 3], [-4, my + 3], [3, my - 3], [10, my + 3], [17, my - 2]], sd + 40); break;
    case 6:
      draw(rr(0, my + 2, 40, 17, 6, 3), { fill: '#fff', seed: sd + 40, lw: 3.5, amp: .7 });
      for (const x of [-10, 0, 10]) line([[x, my - 6], [x, my + 10]], sd + 42 + x, 2.5, .4); break;
    case 7: line([[-8, my - 4], [0, my + 5], [8, my - 4]], sd + 40); break;
    case 8:
      draw([[-18, my - 4], [18, my - 4]].concat(arc(0, my - 4, 18, 18, 0, 180)), { fill: INK, seed: sd + 40, lw: 3, amp: .7 });
      blob(2, my + 9, 8, 4.5, TONGUE); break;
    case 9: line([[-14, my + 2], [4, my + 3], [15, my - 6]], sd + 40); break;
  }

  switch (f.extra) {
    case 1: for (const s of [-1, 1]) for (let i = 0; i < 3; i++) line([[s * (g + 14) - 6 + i * 5, ey + 21], [s * (g + 14) - 2 + i * 5, ey + 14]], sd + 50 + i, 2.4, .3); break;
    case 2: draw([[-g, ey + 13], [-g - 5, ey + 24], [-g, ey + 29], [-g + 5, ey + 24]], { fill: '#bfe0f5', seed: sd + 50, lw: 2.5, amp: .4 }); break;
    case 3: for (let i = 0; i < 6; i++) blob((i < 3 ? -1 : 1) * (g - 6 + (i % 3) * 7), ey + 17 + (i % 2) * 5, 1.7); break;
    case 4: draw([[50, -50], [44, -38], [50, -32], [55, -39]], { fill: '#bfe0f5', seed: sd + 50, lw: 2.5, amp: .4 }); break;
    case 5: line([[-g - 12, ey + 18], [-g - 2, ey + 22]], sd + 50, 2.4, .3); line([[g + 12, ey + 18], [g + 2, ey + 22]], sd + 51, 2.4, .3); break;
  }
}

/* ---------- 3D heads ----------
   Each head is a rounded box. x is right, y is down, z points out of the screen; the view is flat-on (no perspective). */
const FACES = [
  { id: 'front', n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] },
  { id: 'back', n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0] },
  { id: 'right', n: [1, 0, 0], u: [0, 0, -1], v: [0, 1, 0] },
  { id: 'left', n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },
  { id: 'top', n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { id: 'bottom', n: [0, 1, 0], u: [1, 0, 0], v: [0, 0, -1] },
];
function rot(roll, pitch, yaw) {
  const cz = Math.cos(roll), sz = Math.sin(roll), cx = Math.cos(pitch), sx = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  // Rz * Rx * Ry
  return [
    cz * cy - sz * sx * sy, -sz * cx, cz * sy + sz * sx * cy,
    sz * cy + cz * sx * sy, cz * cx, sz * sy - cz * sx * cy,
    -cx * sy, sx, cx * cy];
}
const mul = (R, a) => [R[0] * a[0] + R[1] * a[1] + R[2] * a[2], R[3] * a[0] + R[4] * a[1] + R[5] * a[2], R[6] * a[0] + R[7] * a[1] + R[8] * a[2]];

function drawHead(f, R, blink, mood) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const dims = { front: [f.fw, f.fh, f.fd], back: [f.fw, f.fh, f.fd], right: [f.fd, f.fh, f.fw], left: [f.fd, f.fh, f.fw], top: [f.fw, f.fd, f.fh], bottom: [f.fw, f.fd, f.fh] };
  const list = [], all = [];
  for (const F of FACES) {
    const [w, h, deep] = dims[F.id];
    const n = mul(R, F.n), u = mul(R, F.u), v = mul(R, F.v);
    const m = [u[0], u[1], v[0], v[1], n[0] * deep / 2, n[1] * deep / 2];
    const shape = rr(0, 0, w, h, f.r);
    for (const p of shape) all.push([m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]);
    if (n[2] > 0.03) list.push({ F, m, shape, nz: n[2], w, h });
  }
  MT = null;
  draw(hull(all), { fill: f.color, seed: f.seed + 70, lw: 5, amp: 1.2 });
  list.sort((a, b) => a.nz - b.nz);
  for (const s of list) {
    MT = s.m;
    draw(s.shape, { fill: f.color, seed: f.seed + 71 + s.F.id.length, lw: 3.2, amp: 1.2 });
    ctx.save(); ctx.globalAlpha = .2 * (1 - s.nz); draw(s.shape, { fill: '#000', stroke: false, seed: f.seed + 71 + s.F.id.length, amp: 1.2 }); ctx.restore();
    const id = s.F.id, sd = f.seed + 80;
    if (id === 'front') {
      drawFeatures(f, blink, mood);
      for (let i = 0; i < f.hair; i++) line([[-28 + i * 24, -s.h / 2 + 3], [-29 + i * 24, -s.h / 2 + 12 + hash(sd + i) * 9]], sd + i, 2.6, .3);
    } else if ((id === 'left' || id === 'right') && f.ears) {
      draw(rr(0, -6, s.w * .42, s.h * .46, 18), { fill: f.color, seed: sd + 5, lw: 3.6, amp: 1 });
      line(arc(2, -6, s.w * .09, s.h * .12, 70, 290), sd + 6, 3, .5);
    } else if (id === 'top') {
      for (let i = 0; i < f.hair + 1; i++) line([[-30 + i * 20, 6 + hash(sd + i) * 10], [-27 + i * 20, 24 + hash(sd + i + 4) * 12]], sd + 10 + i, 2.6, .3);
    } else if (id === 'back') {
      line(arc(0, -10, 16, 13, 20, 420, 16).map((p, i) => [p[0] * (1 - i * .035), p[1] * (1 - i * .035) - 6]), sd + 20, 3, .5);
    }
  }
  MT = null;
}

/* ---------- physics ---------- */
const engine = Engine.create({ enableSleeping: false });
engine.gravity.y = 1.15;
const world = engine.world;
let walls = [], floor = null, tipping = 0;
const heads = [];                // { body, ch, yaw, pitch, wy, wp, yaw0, pitch0, k, blinkAt, blinkFor, mood, moodT, pop }
const grabs = new Map();         // pointerId -> { head, con, x0, y0, t0, moved }
let selected = null, count = 0;

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SIDE = Math.max(62, Math.min(124, Math.min(W, H) / 5));
  for (const w of walls) Composite.remove(world, w);
  if (floor) Composite.remove(world, floor);
  const T = 400;
  walls = [
    Bodies.rectangle(-T / 2, H / 2 - 2000, T, H + 8000, { isStatic: true }),
    Bodies.rectangle(W + T / 2, H / 2 - 2000, T, H + 8000, { isStatic: true }),
  ];
  floor = Bodies.rectangle(W / 2, H - 10 + T / 2, W + 2 * T, T, { isStatic: true, friction: .8 });
  Composite.add(world, walls);
  if (!tipping) Composite.add(world, floor);
}
const maxHeads = () => Math.min(90, Math.floor(W * H / (SIDE * SIDE) * .82));

function spawn(x, y) {
  if (heads.length >= maxHeads()) { wiggle($('tip')); return null; }
  const ch = newChar(), k = SIDE / 150 * rnd(.86, 1.14);
  const w = ch.fw * k, h = ch.fh * k;
  x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x));
  const body = Bodies.rectangle(x, y == null ? -h : y, w, h, {
    chamfer: { radius: ch.r * k }, restitution: .22, friction: .55, frictionAir: .008, density: .002, angle: rnd(-.5, .5),
  });
  Body.setAngularVelocity(body, rnd(-.06, .06));
  const hd = { body, ch, k, yaw: rnd(-2, 2), pitch: rnd(-1, 1), wy: rnd(-5, 5), wp: rnd(-3, 3), yaw0: rnd(-.42, .42), pitch0: rnd(-.3, .22), blinkAt: rnd(.5, 4), blinkFor: 0, mood: null, moodT: 0, pop: 0 };
  body.head = hd;
  heads.push(hd); Composite.add(world, body);
  count++; $('n').textContent = heads.length;
  blip(rnd(380, 560), 170, .12, .2);
  return hd;
}
function removeHead(hd) {
  const i = heads.indexOf(hd); if (i < 0) return;
  heads.splice(i, 1); Composite.remove(world, hd.body);
  for (const [id, g] of grabs) if (g.head === hd) { Composite.remove(world, g.con); grabs.delete(id); }
  if (selected === hd) closeCard();
  $('n').textContent = heads.length;
}

let lastThud = 0;
Events.on(engine, 'collisionStart', ev => {
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    const sp = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    if (sp < 5) continue;
    for (const bd of [a, b]) if (bd.head && sp > 9) { bd.head.mood = 'ouch'; bd.head.moodT = .55; }
    if (t - lastThud > .05) { lastThud = t; blip(130, 55, .09, Math.min(.2, sp / 110)); }
  }
});

function step(dt) {
  t += dt;
  Engine.update(engine, dt * 1000);
  if (tipping) { tipping -= dt; if (tipping <= 0) { tipping = 0; Composite.add(world, floor); } }
  for (let i = heads.length - 1; i >= 0; i--) {
    const h = heads[i], b = h.body;
    if (b.position.y > H + 400 || b.position.y < -6000) { removeHead(h); continue; }
    h.pop = Math.min(1, h.pop + dt * 7);
    const vx = b.velocity.x * 60, vy = b.velocity.y * 60, sp = Math.hypot(vx, vy);
    const held = [...grabs.values()].some(g => g.head === h);
    if (sp > 170 || held && sp > 60) {
      // tumbling: spin follows the direction of travel
      h.wy += (vx * .0075 - h.wy) * Math.min(1, dt * 3);
      h.wp += (-vy * .0045 - h.wp) * Math.min(1, dt * 3);
    } else {
      // settling: turn the short way back to this head's resting pose, face to the viewer
      const ty = Math.round((h.yaw - h.yaw0) / 6.283) * 6.283 + h.yaw0, tp = Math.round((h.pitch - h.pitch0) / 6.283) * 6.283 + h.pitch0;
      h.wy += ((ty - h.yaw) * 46 - h.wy * 9) * dt;
      h.wp += ((tp - h.pitch) * 46 - h.wp * 9) * dt;
    }
    h.yaw += h.wy * dt; h.pitch += h.wp * dt;
    h.blinkAt -= dt; h.blinkFor -= dt;
    if (h.blinkAt < 0) { h.blinkFor = .13; h.blinkAt = rnd(1.5, 5); }
    if (h.moodT > 0) { h.moodT -= dt; if (h.moodT <= 0 && !held) h.mood = null; }
  }
}

function render() {
  ctx = mainCtx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // the box
  const y = H - 9, r = 26;
  line([[5, -10], [5, y - r]].concat(arc(5 + r, y - r, r, r, 180, 90, 6), tipping ? [] : [[W / 2, y]], arc(W - 5 - r, y - r, r, r, 90, 0, 6), [[W - 5, -10]]), 900, 3.4, 1.4);
  for (const h of heads) {
    const b = h.body, s = h.k * (reduce ? 1 : .55 + .45 * (1 + .25 * Math.sin(h.pop * Math.PI)) * h.pop);
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.scale(s, s);
    if (h === selected) { ctx.shadowColor = 'rgba(23,22,20,.9)'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 5 * DPR; ctx.shadowOffsetY = 6 * DPR; }
    drawHead(h.ch, rot(b.angle, h.pitch, h.yaw), h.blinkFor > 0, h.mood);
    ctx.restore();
  }
  if (selected) {
    ctx = pctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 208, 208);
    ctx.translate(104, 104); ctx.scale(.86, .86);
    const tt = reduce ? .6 : t;
    drawHead(selected.ch, rot(Math.sin(tt * .9) * .08, Math.sin(tt * .7) * .32 - .1, Math.sin(tt * 1.1) * .95), selected.blinkFor > 0, selected.mood);
    ctx = mainCtx;
  }
}

/* ---------- sound ---------- */
let ac = null, soundOn = true;
function audio() {
  if (!soundOn) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
let armed = false;                  // browsers only allow sound after a first touch
function blip(f0, f1, dur, vol, type = 'sine') {
  if (!armed) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), now = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(.001, now + dur);
  o.connect(g).connect(a.destination); o.start(now); o.stop(now + dur + .02);
}
function wiggle(el) { if (el.animate) el.animate([{ transform: 'rotate(-7deg) scale(1.15)' }, { transform: 'rotate(6deg) scale(1.15)' }, { transform: 'none' }], { duration: 350 }); }

/* ---------- character card ---------- */
function openCard(h) {
  selected = h; const c = h.ch;
  $('cname').textContent = c.name; $('cjob').textContent = c.job;
  $('clikes').textContent = c.likes; $('cfear').textContent = c.fear; $('cplan').textContent = c.plan;
  const card = $('card'); card.hidden = true; void card.offsetWidth; card.hidden = false;
  blip(300, 450, .08, .12, 'triangle');
}
function closeCard() { selected = null; $('card').hidden = true; }
$('close').addEventListener('click', closeCard);
$('pull').addEventListener('click', () => { if (!selected) return; rollFace(selected.ch); selected.mood = null; blip(260, 520, .08, .12, 'triangle'); });
$('toss').addEventListener('click', () => {
  if (!selected) return;
  const b = selected.body;
  Body.setVelocity(b, { x: rnd(-14, 14), y: -rnd(22, 30) }); Body.setAngularVelocity(b, rnd(-.4, .4));
  selected.mood = 'wow'; selected.moodT = 1.2;
  blip(200, 700, .18, .15, 'triangle');
});

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); armed = true; audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = { x: e.clientX, y: e.clientY };
  const hit = Query.point(heads.map(h => h.body), p);
  if (hit.length) {
    const body = hit[hit.length - 1], h = body.head;
    const dx = p.x - body.position.x, dy = p.y - body.position.y, c = Math.cos(-body.angle), s = Math.sin(-body.angle);
    const con = Constraint.create({ pointA: p, bodyB: body, pointB: { x: dx * c - dy * s, y: dx * s + dy * c }, length: 0, stiffness: .12, damping: .12 });
    Composite.add(world, con);
    grabs.set(e.pointerId, { head: h, con, x0: p.x, y0: p.y, t0: performance.now(), moved: false });
    h.mood = 'wow'; h.moodT = 99;
    heads.splice(heads.indexOf(h), 1); heads.push(h);   // bring to the front
  } else if (selected) closeCard();
  else { spawn(p.x); $('hint').classList.add('gone'); }
});
cv.addEventListener('pointermove', e => {
  const g = grabs.get(e.pointerId); if (!g) return;
  g.con.pointA.x = e.clientX; g.con.pointA.y = e.clientY;
  if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 9) g.moved = true;
});
function drop(e) {
  const g = grabs.get(e.pointerId); if (!g) return;
  Composite.remove(world, g.con); grabs.delete(e.pointerId);
  g.head.mood = null; g.head.moodT = 0;
  if (!g.moved && performance.now() - g.t0 < 450 && e.type === 'pointerup') { openCard(g.head); $('hint').classList.add('gone'); }
}
cv.addEventListener('pointerup', drop);
cv.addEventListener('pointercancel', drop);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCard();
  if ((e.code === 'Space' || e.code === 'Enter') && e.target === document.body) { e.preventDefault(); armed = true; spawn(rnd(SIDE, W - SIDE)); }
});
$('tip').addEventListener('click', e => {
  armed = true; closeCard();
  if (!tipping) Composite.remove(world, floor);
  tipping = 1.5;
  for (const h of heads) { h.mood = 'wow'; h.moodT = 1.5; Body.setVelocity(h.body, { x: h.body.velocity.x + rnd(-2, 2), y: h.body.velocity.y + 1 }); }
  blip(500, 90, .4, .15, 'triangle'); e.currentTarget.blur();
});
const sb = $('sound');
sb.addEventListener('click', () => { soundOn = !soundOn; armed = true; sb.textContent = soundOn ? 'Sound on' : 'Sound off'; sb.blur(); });
window.addEventListener('resize', layout);

/* ---------- loop ---------- */
let last = performance.now(), boilT = 0, acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!reduce) { boilT += dt; if (boilT > .16) { boilT = 0; boil++; } }
  acc += dt; let n = 0;
  while (acc >= 1 / 120 && n++ < 8) { step(1 / 120); acc -= 1 / 120; }
  if (n >= 8) acc = 0;
  render();
  requestAnimationFrame(frame);
}
layout();
// start with a few heads already on their way down, like the sketch
for (let i = 0; i < 5; i++) spawn(W * (.16 + .17 * i) + rnd(-20, 20), -SIDE * (1 + i * 1.3));
requestAnimationFrame(frame);
})();
</script>
<!--/page-->
</body>
